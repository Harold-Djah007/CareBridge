name: Apply CareBridge reviewed upgrade

on:
  push:
    branches:
      - feature/carebridge-commerce-ui-refresh

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[carebridge-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .carebridge-upgrade/part-* > /tmp/carebridge-upgrade.patch.gz.b64
          base64 --decode /tmp/carebridge-upgrade.patch.gz.b64 > /tmp/carebridge-upgrade.patch.gz
          gzip --decompress --stdout /tmp/carebridge-upgrade.patch.gz > /tmp/carebridge-upgrade.patch
          git apply --check /tmp/carebridge-upgrade.patch
          git apply /tmp/carebridge-upgrade.patch

      - name: Validate server and client source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="CareBridge_Health_Consultation_FULL_PROJECT/CareBridge_Health_Consultation"
          for file in "$ROOT"/server/*.js; do node --check "$file" >/dev/null; done
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import path from 'path';
          const root = 'CareBridge_Health_Consultation_FULL_PROJECT/CareBridge_Health_Consultation/client/src';
          const stack = [root];
          let count = 0;
          while (stack.length) {
            const dir = stack.pop();
            for (const name of fs.readdirSync(dir)) {
              const file = path.join(dir, name);
              const stat = fs.statSync(file);
              if (stat.isDirectory()) stack.push(file);
              else if (/\.(js|jsx)$/.test(name)) {
                const text = fs.readFileSync(file, 'utf8');
                if (!text.trim()) throw new Error(`Empty source file: ${file}`);
                count += 1;
              }
            }
          }
          console.log(`Validated ${count} client JS/JSX source files for presence.`);
          NODE

      - name: Commit reviewed CareBridge upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .carebridge-upgrade
          rm -f .github/workflows/apply-carebridge-upgrade.yml
          git config user.name "CareBridge Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate secure ecommerce and refresh CareBridge UI/UX [carebridge-applied]"
          git push origin HEAD:feature/carebridge-commerce-ui-refresh
