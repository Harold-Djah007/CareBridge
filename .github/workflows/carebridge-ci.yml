name: CareBridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CareBridge_Health_Consultation_FULL_PROJECT/CareBridge_Health_Consultation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund

      - name: Install client dependencies
        run: npm install --prefix client --no-audit --no-fund

      - name: Syntax-check server modules
        shell: bash
        run: |
          set -euo pipefail
          for file in server/*.js; do
            node --check "$file"
          done

      - name: Build web client
        run: npm run build --prefix client
