name: CareBridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carebridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carebridge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: CareBridge_Health_Consultation_FULL_PROJECT/CareBridge_Health_Consultation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund

      - name: Install client dependencies
        run: npm install --prefix client --no-audit --no-fund

      - name: Install Chromium Firefox and WebKit quality runtimes
        shell: bash
        run: |
          set -euo pipefail
          cd client
          npx playwright install --with-deps chromium firefox webkit

      - name: Syntax-check server modules
        shell: bash
        run: |
          set -euo pipefail
          for file in server/*.js; do
            node --check "$file"
          done
          for file in server/*.mjs; do
            node --check "$file"
          done
          node --check scripts/postdeploy-smoke.mjs
          node --check scripts/release-audit.mjs
          sh -n deploy/backup-postgres.sh
          sh -n deploy/restore-postgres.sh

      - name: Repository release hygiene audit
        run: npm run audit:release

      - name: Validate production Compose contract
        run: docker compose --env-file deploy/.env.production.example -f docker-compose.production.yml config --quiet

      - name: Build web client
        run: npm run build --prefix client

      - name: Client performance budget
        run: npm run quality:budget --prefix client

      - name: Build hardened production container
        run: docker build --pull -t carebridge-ci:${{ github.sha }} .

      - name: Runtime regression across all authenticated roles
        shell: bash
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-ci-db.json
          DATA_FILE=/tmp/carebridge-ci-db.json PORT=5055 LOG_LEVEL=silent node server/ci-role-regression.mjs

      - name: Security and persistence regression
        shell: bash
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-security-ci-db.json
          DATA_FILE=/tmp/carebridge-security-ci-db.json PORT=5056 LOG_LEVEL=silent node server/ci-security-regression.mjs

      - name: PostgreSQL enterprise persistence regression
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/carebridge_ci
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-postgres-ci-db.json
          DATA_FILE=/tmp/carebridge-postgres-ci-db.json node server/ci-postgres-regression.mjs

      - name: Enterprise 9.5 interoperability clinical finance and Redis regression
        shell: bash
        env:
          REDIS_URL: redis://127.0.0.1:6379
          MFA_ENCRYPTION_KEY: ci-carebridge-mfa-encryption-key-2026
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-enterprise95-ci-db.json
          DATA_FILE=/tmp/carebridge-enterprise95-ci-db.json PORT=5057 LOG_LEVEL=silent node server/ci-enterprise95-regression.mjs

      - name: PostgreSQL primary runtime restart regression
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/carebridge_ci
          MFA_ENCRYPTION_KEY: ci-carebridge-mfa-encryption-key-2026
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-runtime-postgres-ci-db.json
          DATA_FILE=/tmp/carebridge-runtime-postgres-ci-db.json LOG_LEVEL=silent node server/ci-runtime-postgres.mjs

      - name: Encrypted PostgreSQL disaster-recovery drill
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/carebridge_ci
          BACKUP_ENCRYPTION_KEY: ci-carebridge-backup-key-2026
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-dr-ci-db.json
          DATA_FILE=/tmp/carebridge-dr-ci-db.json node server/ci-disaster-recovery.mjs

      - name: Production-mode release certification
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/carebridge_ci
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-production-ci-db.json
          DATA_FILE=/tmp/carebridge-production-ci-db.json node server/ci-production-release.mjs

      - name: Authenticated concurrency and SLO regression
        shell: bash
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-load-ci-db.json
          DATA_FILE=/tmp/carebridge-load-ci-db.json PORT=5062 LOG_LEVEL=silent CI_P95_BUDGET_MS=1000 node server/ci-load-slo-regression.mjs

      - name: Browser UX quality regression across desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-browser-ci-db.json
          CAREBRIDGE_E2E_DATA_FILE=/tmp/carebridge-browser-ci-db.json npm run quality:e2e --prefix client

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: carebridge-browser-quality-${{ github.run_id }}
          path: |
            CareBridge_Health_Consultation_FULL_PROJECT/CareBridge_Health_Consultation/client/test-results
            CareBridge_Health_Consultation_FULL_PROJECT/CareBridge_Health_Consultation/client/playwright-report
          if-no-files-found: ignore
          retention-days: 7
