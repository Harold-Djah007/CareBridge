name: CareBridge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carebridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carebridge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: CareBridge_Health_Consultation_FULL_PROJECT/CareBridge_Health_Consultation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund

      - name: Install client dependencies
        run: npm install --prefix client --no-audit --no-fund

      - name: Syntax-check server modules
        shell: bash
        run: |
          set -euo pipefail
          for file in server/*.js; do
            node --check "$file"
          done
          for file in server/*.mjs; do
            node --check "$file"
          done

      - name: Build web client
        run: npm run build --prefix client

      - name: Runtime regression across all authenticated roles
        shell: bash
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-ci-db.json
          DATA_FILE=/tmp/carebridge-ci-db.json PORT=5055 LOG_LEVEL=silent node server/ci-role-regression.mjs

      - name: Security and persistence regression
        shell: bash
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-security-ci-db.json
          DATA_FILE=/tmp/carebridge-security-ci-db.json PORT=5056 LOG_LEVEL=silent node server/ci-security-regression.mjs

      - name: PostgreSQL enterprise persistence regression
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/carebridge_ci
        run: |
          set -euo pipefail
          cp server/data/db.json /tmp/carebridge-postgres-ci-db.json
          DATA_FILE=/tmp/carebridge-postgres-ci-db.json node server/ci-postgres-regression.mjs
